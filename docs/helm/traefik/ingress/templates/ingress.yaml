apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ .Release.Name }}
  namespace: {{ .Release.Namespace }}
  annotations:
    kubernetes.io/ingress.class: {{ .Values.annotations.ingressClass | default "traefik" }}
spec:
  ingressClassName: {{ .Values.spec.ingressClassName }}
  rules:
    - host: {{ .Values.spec.rules.host }}
      http:
        paths:
{{- range .Values.spec.rules.paths }}
          - path: {{ .path }}
            pathType: {{ .pathType }}
            backend:
              service:
                name: {{ .backend.service.name }}
                port:
                  number: {{ .backend.service.port }}
{{- end }}
{{- if .Values.tls.enabled }}
  tls:
    - hosts:
        - {{ .Values.spec.rules.host }}
      secretName: {{ .Values.tls.secretName }}
{{- end }}